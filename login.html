<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — Glitch Shop</title>
  <meta name="description" content="Accede o crea tu cuenta en Glitch Shop. Guarda tu carrito y gestiona tus pedidos." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Source+Sans+3:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined|Material+Icons+Round" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="styles.css?v=typography-20260913" />
</head>
<body class="glauth" id="glauthBody">

  <a href="index.html" class="glauth__back" aria-label="Volver a la tienda">
    <span class="material-icons">arrow_back</span>
    Volver a la tienda
  </a>

  <main class="glauth__wrap" role="main">

    <section class="glauth__card" aria-label="Iniciar sesión o crear cuenta">

      <header class="glauth__head">
        <a class="glauth__logo" href="index.html" aria-label="Glitch Shop, inicio">
          <img src="imagenes/hola1.jpg" alt="Glitch Shop" />
        </a>

        <span class="glauth__pill" id="glauthPill">
          TU CUENTA GLITCH
        </span>

        <h1 class="glauth__title" id="authModalTitle">Iniciar sesión</h1>
        <p class="glauth__sub" id="authPanelSub">
          Ingresa tu correo y contraseña para entrar a tu cuenta.
        </p>
      </header>

      <div class="glauth__tabs" role="tablist" aria-label="Acceso a tu cuenta">
        <button type="button" class="glauth__tab glauth__tab--active" data-tab="signin" id="tabSignIn" role="tab" aria-selected="true">
          <span class="material-icons">login</span>
          Iniciar sesión
        </button>
        <button type="button" class="glauth__tab" data-tab="signup" id="tabSignUp" role="tab" aria-selected="false">
          <span class="material-icons">person_add</span>
          Crear cuenta
        </button>
      </div>

      <form id="authForm" class="glauth__form" autocomplete="on" role="tabpanel" aria-labelledby="tabSignIn">
        <div id="authNameField" hidden>
          <label for="authName" class="glauth__label">Nombre completo</label>
          <div class="glauth__field">
            <span class="material-icons glauth__field-icon">badge</span>
            <input id="authName" type="text" placeholder="Tu nombre y apellidos" autocomplete="name" required />
          </div>
        </div>

        <div>
          <label for="authEmail" class="glauth__label">Correo electrónico</label>
          <div class="glauth__field">
            <span class="material-icons glauth__field-icon">alternate_email</span>
            <input id="authEmail" type="email" placeholder="tu@correo.com" autocomplete="email" required />
          </div>
        </div>

        <div>
          <div class="glauth__labelrow">
            <label for="authPassword" class="glauth__label">Contraseña</label>
            <button type="button" class="glauth__link" id="forgotBtn" hidden>
              ¿Olvidaste tu contraseña?
            </button>
          </div>
          <div class="glauth__field">
            <span class="material-icons glauth__field-icon">lock</span>
            <input id="authPassword" type="password" placeholder="••••••••" minlength="6" autocomplete="current-password" required />
            <button type="button" class="glauth__eye" id="togglePassword" aria-label="Mostrar contraseña" title="Mostrar contraseña">
              <span class="material-icons">visibility</span>
            </button>
          </div>
          <div class="glauth__hinttext" id="authPasswordHint" hidden>
            Usa al menos 6 caracteres.
          </div>
        </div>

        <div class="glauth__status" id="authHint" role="status" aria-live="polite" hidden></div>

        <button type="submit" class="glauth__submit" id="authSubmitBtn">
          <span class="material-icons" id="authSubmitIcon">arrow_forward</span>
          <span id="authSubmitText">Continuar</span>
          <span class="glauth__submit-loader" hidden>
            <span class="material-icons glauth__spin">progress_activity</span>
          </span>
        </button>

        <p class="glauth__switch" id="authSwitchPrompt">
          ¿No tienes cuenta aún?
          <button type="button" class="glauth__switchlink" data-jumptab="signup">Crea una gratis</button>
        </p>
      </form>

      <footer class="glauth__foot">
        <span class="material-icons" aria-hidden="true">sports_esports</span>
        Tu próxima partida empieza aquí.
      </footer>

    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="script.js?v=cart-20260914"></script>
</body>
</html>
